<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Evolution API | The Blue</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .test-card {
            width: 100%;
            max-width: 450px;
            animation: animate-pop 0.4s ease-out;
        }
        .status-badge {
            display: none;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
        }
        .status-success { background: rgba(76, 175, 80, 0.1); color: #4CAF50; border: 1px solid #4CAF50; display: block; }
        .status-error { background: rgba(255, 82, 82, 0.1); color: #FF5252; border: 1px solid #FF5252; display: block; }
    </style>
</head>
<body>
    <div class="test-card glass-card">
        <div style="text-align: center; margin-bottom: 25px;">
            <i class="fa-brands fa-whatsapp" style="font-size: 3rem; color: #25D366; margin-bottom: 10px;"></i>
            <h2 style="color: white;">Teste Evolution API</h2>
            <p>Envie mensagens de teste para o WhatsApp</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label style="display: block; font-size: 0.75rem; margin-bottom: 5px; color: var(--text-dim);">URL da API</label>
                <input type="text" id="api-url" value="http://localhost:8080" class="input-field" placeholder="http://localhost:8080">
            </div>

            <div>
                <label style="display: block; font-size: 0.75rem; margin-bottom: 5px; color: var(--text-dim);">Nome da Instância</label>
                <input type="text" id="instance-name" value="MeuBot" class="input-field" placeholder="Ex: MeuBot">
            </div>

            <div>
                <label style="display: block; font-size: 0.75rem; margin-bottom: 5px; color: var(--text-dim);">API Key (Global ou Instância)</label>
                <input type="password" id="api-key" class="input-field" placeholder="Insira sua API Key">
            </div>

            <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 5px 0;">

            <div>
                <label style="display: block; font-size: 0.75rem; margin-bottom: 5px; color: var(--text-dim);">Número do Destinatário</label>
                <input type="text" id="dest-number" value="5519999995149" class="input-field" placeholder="DDI + DDD + Número">
            </div>

            <div>
                <label style="display: block; font-size: 0.75rem; margin-bottom: 5px; color: var(--text-dim);">Mensagem</label>
                <textarea id="message-text" class="input-field" style="min-height: 80px; resize: none;" placeholder="Sua mensagem de teste...">Olá! Esta é uma mensagem de teste enviada via Evolution API através do painel The Blue. 🚀</textarea>
            </div>

            <button id="send-btn" class="btn btn-primary" style="width: 100%; padding: 15px; margin-top: 10px;" onclick="handleSendMessage()">
                <i class="fa-solid fa-paper-plane"></i> ENVIAR MENSAGEM
            </button>
        </div>

        <div id="status-msg" class="status-badge"></div>

        <div style="margin-top: 25px; text-align: center;">
            <button class="btn btn-outline" style="font-size: 0.8rem;" onclick="window.location.href='/'">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao App
            </button>
        </div>
    </div>

    <script>
        async function handleSendMessage() {
            const btn = document.getElementById('send-btn');
            const status = document.getElementById('status-msg');
            
            const apiUrl = document.getElementById('api-url').value.replace(/\/$/, '');
            const instance = document.getElementById('instance-name').value;
            const apiKey = document.getElementById('api-key').value;
            const number = document.getElementById('dest-number').value.replace(/\D/g, '');
            const text = document.getElementById('message-text').value;

            if (!apiKey) {
                showStatus("Por favor, insira a API Key.", false);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> ENVIANDO...';
            status.style.display = 'none';

            try {
                const endpoint = `${apiUrl}/message/sendText/${instance}`;
                
                // Payload mais completo para evitar erro 400
                const payload = {
                    number: number,
                    options: {
                        delay: 1200,
                        presence: "composing",
                        linkPreview: false
                    },
                    textMessage: {
                        text: text
                    }
                };

                // Versão simplificada (tente as duas se necessário)
                // const payload = { number: number, text: text };

                console.log("📤 Enviando Payload:", payload);
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': apiKey
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    showStatus("✅ Mensagem enviada com sucesso!", true);
                    console.log("🚀 Sucesso da API:", result);
                } else {
                    // Log detalhado do erro para diagnóstico
                    console.error("❌ Detalhes do Erro 400:", result);
                    const errorMsg = result.message || JSON.stringify(result.errors) || "Erro de validação (400)";
                    showStatus(`❌ Erro: ${errorMsg}`, false);
                }
            } catch (error) {
                showStatus(`💥 Erro de Conexão: ${error.message}`, false);
                console.error("Erro de rede:", error);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ENVIAR MENSAGEM';
            }
        }

        function showStatus(msg, isSuccess) {
            const status = document.getElementById('status-msg');
            status.innerText = msg;
            status.className = `status-badge ${isSuccess ? 'status-success' : 'status-error'}`;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
